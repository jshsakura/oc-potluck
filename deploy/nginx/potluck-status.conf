# PotLuck status page behind host nginx, with a Let's Encrypt certificate (DNS only,
# no CDN in front). The relay container serves the page itself when
# LDN_WEB_ENABLED=true, on the status port compose.server.yml publishes on
# 127.0.0.1:30457 only; nginx adds TLS and rate limits in front of it.
# relay.example.com stands for your host name; replace it when you deploy, and set
# LDN_SITE_ORIGIN=https://relay.example.com so the share card points at it.

limit_req_zone $binary_remote_addr zone=potluck_rooms:1m rate=2r/s;

server {
    listen 80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:potluck_status:1m;

    server_tokens off;

    # Visitors' addresses are not kept.
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The relay sets the page's own headers (CSP, nosniff, referrer and permissions).
    proxy_set_header Host status;
    # The relay counts each viewer by this, since nginx connects from a local address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    location = /api/rooms {
        limit_except GET { deny all; }
        limit_req zone=potluck_rooms burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:30457;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:30457;
    }
}
