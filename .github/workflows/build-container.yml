name: Build Container

on:
  schedule:
    # 1st of every month at 04:00 UTC
    - cron: '0 4 1 * *'
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - sysmodule/Atmosphere-libs
      - .github/workflows/build-container.yml
    branches: [main]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  # Each architecture builds on its own native runner: devkitpro/devkita64 ships
  # amd64 and arm64, so ARM hosts build PotLuck without amd64 emulation.
  build:
    name: Builder image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

  manifest:
    name: Publish multi-architecture builder
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge architectures
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:${GITHUB_SHA::7}" \
            "$image:${GITHUB_SHA}-amd64" "$image:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest.Digest}}'
