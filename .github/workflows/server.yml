name: Publish LDN Server

on:
  workflow_call:
    inputs:
      version: {required: true, type: string}
  workflow_dispatch:
    inputs:
      version: {required: true, type: string, default: v0.2.9}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare source and image name
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Verify hardened deployment and protocol integration
        run: bash server/verify-container.sh "$IMAGE:$VERSION-${{ matrix.arch }}"
      - name: Publish tested image
        run: docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  manifest:
    name: Publish multi-architecture server
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge tested architectures
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          docker buildx imagetools create --tag "$image:$VERSION" --tag "$image:latest" \
            "$image:$VERSION-amd64" "$image:$VERSION-arm64"
      - name: Verify anonymous pull access
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image:$VERSION" >/dev/null
