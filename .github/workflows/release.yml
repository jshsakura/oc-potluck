name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

env:
  # Relay server image the integration tests run against (published by server.yml)
  SERVER_IMAGE_VERSION: v0.2.9

permissions:
  contents: write
  packages: read

jobs:
  verify-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow dispatch — skipping branch check"
            exit 0
          fi
          git fetch origin main
          TAG_COMMIT="${{ github.sha }}"
          MAIN_TIP=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_TIP"; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Releases can only be created from main."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on main ✓"

  test:
    name: Tests & Coverage ≥ 80%
    runs-on: ubuntu-latest
    needs: verify-branch

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ netcat-openbsd
          pip install gcovr
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run unit tests with coverage
        run: |
          bash scripts/ci/run-limited.sh --setup
          bash scripts/ci/run-limited.sh make -C tests clean
          bash scripts/ci/run-limited.sh make -C tests -j1 COVERAGE=1 test

      - name: Build integration tests with coverage
        run: |
          bash scripts/ci/run-limited.sh make -C tests/integration clean
          bash scripts/ci/run-limited.sh make -C tests/integration -j1 COV=1 all

      - name: Start relay server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tests/integration
          # The published server image (server.yml): building it here would run
          # dotnet outside the test memory budget, which only covers containers.
          bash prepare-compose.sh "ghcr.io/${GITHUB_REPOSITORY,,}-server:${SERVER_IMAGE_VERSION}"
          yq -i '.services[].cgroup_parent = "potluck-ci-tests.slice"' docker-compose.yml
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -f docker-compose.yml up -d --no-build
          for container_id in $(docker compose -f docker-compose.yml ps -q); do
            pid=$(docker inspect --format '{{.State.Pid}}' "$container_id")
            cg_path=$(sudo cut -d: -f3 "/proc/$pid/cgroup")
            case "$cg_path" in
              /potluck.slice/potluck-ci.slice/potluck-ci-tests.slice/*) ;;
              *) echo "::error::Test container escaped memory budget"; exit 1 ;;
            esac
          done
          bash ../../scripts/ci/run-limited.sh bash wait-for-server.sh localhost 30456 60

      - name: Run integration tests with coverage
        run: |
          cd tests/integration
          bash ../../scripts/ci/run-limited.sh env INTEGRATION_COMPOSE_FILE="$(pwd)/docker-compose.yml" ./run_integration_tests localhost 30456

      - name: Tear down relay server
        if: always()
        run: cd tests/integration && docker compose -f docker-compose.yml down -v

      - name: Enforce per-file coverage ≥ 80%
        run: bash scripts/ci/run-limited.sh python3 scripts/check-coverage.py --min 80 --root .

      - name: Compute average coverage
        id: coverage
        run: |
          python3 scripts/check-coverage.py --min 0 --root . --json /tmp/cov.json || true
          python3 <<'PYEOF' > /tmp/avg.txt
          import json
          with open('/tmp/cov.json') as f:
              d = json.load(f)
          files = [f for f in d.get('files', []) if 'sysmodule/source/' in (f.get('file', f.get('filename', '')))]
          total_lines = 0
          total_covered = 0
          for f in files:
              lines = f.get('lines', [])
              if isinstance(lines, list):
                  total_lines += len(lines)
                  total_covered += sum(1 for l in lines if l.get('count', 0) > 0)
          avg = (total_covered / total_lines * 100) if total_lines > 0 else 0
          print(f'{avg:.1f}')
          PYEOF
          echo "percent=$(cat /tmp/avg.txt)" >> $GITHUB_OUTPUT


  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test
    container: ghcr.io/jshsakura/oc-potluck:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory '*'
          git symbolic-ref HEAD refs/heads/"${GITHUB_REF_NAME:-main}" 2>/dev/null || true

      - name: Build sysmodule + overlay + dist ZIP
        env:
          DEVKITPRO: /opt/devkitpro
        run: WORKSPACE_DIR="${GITHUB_WORKSPACE}" bash "${GITHUB_WORKSPACE}/scripts/ci/container-tasks.sh" build

      - name: Build installer NRO
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          cd installer
          ./fetch-cacert.sh
          make -j2

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: potluck-release.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/potluck-installer.nro
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols
          path: |
            sysmodule/potluck.elf
            sysmodule/potluck.nso
          if-no-files-found: error

  server:
    name: Verify Server Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deployment images are publicly available
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          while IFS= read -r image; do
            DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$image" >/dev/null
          done < <(docker compose -f compose.server.yml config --images)

  create-release:
    name: Create Release
    needs: [build, server]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: .

      - name: Download debug symbols
        uses: actions/download-artifact@v8
        with:
          name: debug-symbols
          path: debug

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: installer
          path: .

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename ZIP with version
        run: mv potluck-release.zip potluck-${{ steps.version.outputs.version }}.zip

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          cat > CHANGELOG_RELEASE.md << 'HEADER'
          <img src="https://raw.githubusercontent.com/jshsakura/oc-potluck/main/overlay/potluck.jpg" width="96" alt="PotLuck icon">

          ## potluck ${VERSION}

          Nintendo Switch LDN sysmodule: local wireless multiplayer through a relay server (remote) or on the same Wi-Fi network (local, ldn_mitm compatible).

          ### Installation

          - Installer: copy `potluck-installer.nro` to `switch/` on the SD card and open it from the Homebrew Menu. It downloads this release, installs it and turns off ldn_mitm's autostart.
          - Manual: extract the ZIP to the root of the SD card, remove `atmosphere/contents/4200000000000010/flags/boot2.flag` if ldn_mitm is installed, and reboot.

          Open the overlay menu (L + D-Pad Down + Right Stick Click) and select potluck. to switch between remote and local.

          ---

          ### Changelog
          HEADER

          if [ -n "$PREV_TAG" ]; then
            echo "" >> CHANGELOG_RELEASE.md
            echo "Changes since \`${PREV_TAG}\`:" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG_RELEASE.md
          else
            echo "- Initial release" >> CHANGELOG_RELEASE.md
          fi

          # The header is a quoted heredoc so its backticks stay text; put the version in afterwards
          sed -i "s|\${VERSION}|${VERSION}|g" CHANGELOG_RELEASE.md

          echo ""
          echo "=== Generated changelog ==="
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: potluck ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          files: |
            compose.server.yml
            potluck-${{ steps.version.outputs.version }}.zip
            potluck-installer.nro
            debug/potluck.elf
